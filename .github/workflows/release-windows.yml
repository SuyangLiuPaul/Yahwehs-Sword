# SeekSparks — Windows desktop release build
#
# Builds the native Windows (x64) app on a GitHub-hosted windows-latest
# runner (no local machine needed) and publishes it as a downloadable
# release asset.
#
# Triggers
#   * push of a version tag  v*   → build, then attach the zip to that
#     tag's GitHub Release (creating the release if it doesn't exist).
#     This is the normal path: `git tag v1.3.86 && git push origin v1.3.86`.
#   * workflow_dispatch (manual "Run workflow" button / gh workflow run)
#     → always builds + uploads the zip as a downloadable *workflow
#     artifact*. If you also type an existing tag in the input, it
#     additionally attaches the zip to that release. Leave the tag blank
#     to do a safe test build that touches no release.
#
# The build includes windows/runner/firebase_msvc_compat.cc, which
# resolves the prebuilt Firebase C++ libs against modern MSVC vcruntime.
name: Release Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the build to (blank = test build, artifact only, no release touched)'
        required: false
        default: ''

# Needed so the built-in GITHUB_TOKEN can create/upload release assets.
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'   # keep in step with flutter-ci.yml
          channel: 'stable'
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Resolve tag
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package zip
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          $src   = "build/windows/x64/runner/Release"
          $stage = "staging/Yahwehs-Sword"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Get-ChildItem $src -Exclude *.lib,*.exp | Copy-Item -Destination $stage -Recurse -Force
          $zip = "Yahwehs-Sword-Windows-x64-$tag.zip"
          Compress-Archive -Path "staging/Yahwehs-Sword" -DestinationPath $zip -Force
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Packaged $zip ($([math]::Round((Get-Item $zip).Length/1MB,1)) MB)"

      # 2026-09-25: a single-file installer beside the zip, so the About page
      # can offer "download for Windows" the way it does the APK. Per-user
      # install (no admin prompt). STILL UNSIGNED - SmartScreen will warn on
      # first run, exactly as it does for the zip; only a code-signing
      # certificate or the Microsoft Store removes that.
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $tag = "${{ steps.ver.outputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          $ver = $tag -replace '^v',''
          if ($ver -notmatch '^\d+(\.\d+)*$') { $ver = '0.0.0' }
          $base = "Yahwehs-Sword-Setup-$tag"
          $iss = @"
          [Setup]
          AppId={{B7E2A6D4-1F53-4C8E-A9D0-6B4C2E8F1A37}
          AppName=Yahweh's Sword
          AppVersion=$ver
          AppPublisher=Yahweh's People
          AppPublisherURL=https://yahwehword.com
          DefaultDirName={autopf}\Yahwehs-Sword
          DefaultGroupName=Yahweh's Sword
          UninstallDisplayIcon={app}\Yahwehs-Sword.exe
          PrivilegesRequired=lowest
          PrivilegesRequiredOverridesAllowed=dialog
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          Compression=lzma2
          SolidCompression=yes
          OutputDir=$env:GITHUB_WORKSPACE
          OutputBaseFilename=$base
          [Files]
          Source: "$env:GITHUB_WORKSPACE\build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion; Excludes: "*.lib,*.exp"
          [Icons]
          Name: "{group}\Yahweh's Sword"; Filename: "{app}\Yahwehs-Sword.exe"
          Name: "{autodesktop}\Yahweh's Sword"; Filename: "{app}\Yahwehs-Sword.exe"; Tasks: desktopicon
          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"
          [Run]
          Filename: "{app}\Yahwehs-Sword.exe"; Description: "Launch Yahweh's Sword"; Flags: nowait postinstall skipifsilent
          "@
          Set-Content -Path setup.iss -Value $iss -Encoding utf8
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" setup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          "SETUP=$base.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Built $base.exe ($([math]::Round((Get-Item "$base.exe").Length/1MB,1)) MB)"

      - name: Upload workflow artifact (always)
        uses: actions/upload-artifact@v7
        with:
          name: Yahwehs-Sword-Windows-x64
          path: |
            ${{ env.ZIP }}
            ${{ env.SETUP }}
          if-no-files-found: error

      - name: Attach to GitHub Release (tag builds only)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          # A release is the only thing the in-app updater reads: it polls
          # releases/latest (lib/services/update_service.dart). A manual run
          # takes an arbitrary ref, and `gh release create` would CREATE the
          # tag on that ref — so a mistyped tag would publish an unreviewed
          # build straight to every reader. Only the tag-push path may cut a
          # release; a manual run attaches to one that already exists.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Release '$tag' does not exist. A manual run only attaches to an existing release; to cut a new one push the tag (tools/tag_release.sh). The build is still available above as a workflow artifact."
              exit 1
            fi
            # create-if-missing; `|| true` guards the race where a
            # sibling platform workflow created it a moment earlier.
            gh release create "$tag" \
              --title "$tag — Windows desktop build" \
              --notes "Automated Windows x64 build. Download the zip, extract, and run \`Yahwehs-Sword\\Yahwehs-Sword.exe\`. The exe is unsigned — on first launch click **More info → Run anyway** past Windows SmartScreen."
          fi
          gh release upload "$tag" "$ZIP" "$SETUP" --clobber
