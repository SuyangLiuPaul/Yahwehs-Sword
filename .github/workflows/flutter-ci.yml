# SeekSparks — Flutter CI
#
# 2026-05-24 (v1.3.22): catches regressions before they ship to prod.
# Pre-fix the only quality gate was the developer remembering to run
# `flutter analyze && flutter test` locally before pushing. With the
# error monitor live (v1.3.21) we'd at least *see* a runtime crash,
# but a build that fails analysis or breaks an existing test was
# completely invisible until the next manual run.
#
# Triggers
#   * Every push to main (the deploy branch — Netlify CLI deploys
#     happen from a contributor's machine, not Netlify's git linkage,
#     so this workflow is the only automated check between commit
#     and prod)
#   * Every PR targeting main
#
# Steps
#   1. Checkout
#   2. Setup Flutter (pinned to the version in pubspec — bump here
#      and in the dev environment together)
#   3. Cache the pub cache + .dart_tool so subsequent runs are fast
#   4. flutter pub get
#   5. flutter analyze — fail on any new analysis issues. The
#      3 pre-existing settings_page infos are tolerated (counted +
#      compared; any new finding fails the build)
#   6. flutter test — must be 109/109 (current count). New tests
#      that pass push the threshold up; failing or skipping a
#      previously-passing test breaks the build.
#
# Runs on ubuntu-latest. iOS / macOS / Android builds are NOT
# exercised here — they're built daily by a local launchd job — WRONG, corrected 2026-09-06: the sibling apps have such a job, this one has none, and launchd is TCC-blocked from ~/Documents so it could not run from this repo anyway
# (tools/yswords-ios-reinstall.sh) which catches platform-
# specific build failures (CocoaPods, NDK, Gradle).
name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Bind checkout and scan to the same immutable event revision.
          # Full history includes the PR merge's parents; an orphaned force-
          # push `before` object is fetched by SHA by ci_secret_scan.py.
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pin to the Flutter version the local dev env uses
          # (the canonical install at /Users/pliu0036/flutter is
          # 3.44.2 per the README badge). Bump here when the
          # local toolchain bumps.
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        # v1.3.25: --no-fatal-infos REMOVED. The 2 pre-existing
        # settings_page `use_build_context_synchronously` infos were
        # closed by capturing ScaffoldMessenger before the await,
        # so flutter analyze now exits 0 cleanly. From this point
        # forward CI fails on ANY new info-level finding — strictest
        # quality gate.
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

      # gitleaks-action@v3 reads the LIVE PR commit list at scan time.
      # Three Oct 1 runs scanned a newer head absent from their earlier
      # checkout and failed with Invalid revision range. Use the same
      # official 8.24.3 engine, pinned to the publisher's archive checksum,
      # with event-only scope and fail-closed range validation instead.
      - name: Install verified Gitleaks 8.24.3
        run: |
          set -euo pipefail
          GITLEAKS_ARCHIVE="$RUNNER_TEMP/gitleaks_8.24.3_linux_x64.tar.gz"
          curl -fL --retry 3 --retry-all-errors --retry-delay 2 \
            -o "$GITLEAKS_ARCHIVE" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $GITLEAKS_ARCHIVE" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$GITLEAKS_ARCHIVE" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" version

      - name: Secret scan event-range regression tests
        run: python3 test/test_ci_secret_scan.py

      - name: Gitleaks secret scan
        id: secret-scan
        run: python3 tools/ci_secret_scan.py

      - name: Preserve redacted Gitleaks report
        if: ${{ always() && steps.secret-scan.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: results.sarif
          retention-days: 7
